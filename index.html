function calcRes(){
  const pairs=D.etfs.filter(e=>e.krEq);
  const e=pairs.find(x=>x.t===calc.pair)||pairs[0];
  const P=calc.amt||0,Y=Math.max(calc.yrs||1,.1),r=(calc.rate||0)/100;
  const gain=P*(Math.pow(1+r,Y)-1);
  // 미국 직투: 환전(편도 fee%) 매수·매도, 보수, 양도세 22%(250만원 공제)
  const feeUS=P*calc.fee/100*2, erUS=P*(e.er/100)*Y, grossUS=gain-feeUS-erUS;
  const taxUS=Math.max(0,grossUS-2500000)*0.22;
  const feeKR=0, erKR=P*((e.krEq.ter??0.1)/100)*Y, grossKR=gain-erKR;
  const taxKR=Math.max(0,grossKR)*0.154;
  const netUS=grossUS-taxUS,netKR=grossKR-taxKR,diff=netUS-netKR;
  return `<div class="res">
   <div class="ln"><span>🇺🇸 ${e.t} 세후 수익</span><b>${man(netUS/10000)}</b></div>
   <div class="ln"><span>　세금 / 환전비 / 보수</span><span>${man(taxUS/10000)} / ${man(feeUS/10000)} / ${man(erUS/10000)}</span></div>
   <div class="ln" style="margin-top:6px"><span>🇰🇷 국내 ETF 세후 수익</span><b>${man(netKR/10000)}</b></div>
   <div class="ln"><span>　세금 / 보수</span><span>${man(taxKR/10000)} / ${man(erKR/10000)}</span></div>
   <div class="ln tot"><span>${diff>=0?'미국 직투가 더 남아요':'국내 상장이 더 남아요'}</span><b class="${diff>=0?'up':'dn'}" style="font-size:18px">${man(Math.abs(diff)/10000)}</b></div></div>`;
}

function spark(a,w=320,h=90){
  const mn=Math.min(...a),mx=Math.max(...a),sx=w/(a.length-1),sy=v=>h-6-(v-mn)/(mx-mn||1)*(h-12);
  const p=a.map((v,i)=>`${i?'L':'M'}${(i*sx).toFixed(1)},${sy(v).toFixed(1)}`).join('');
  const c=a[a.length-1]>=a[0]?'var(--up)':'var(--dn)';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><path d="${p}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

  const times=c.times.map(t=>`<span class="chip on tm">${t}<i data-al="deltime" data-v="${t}">×</i></span>`).join('');
  const thin=`<span class="chip thin${[3,5,10].includes(c.th)?'':' on'}">직접 ±<input type="number" inputmode="decimal" step="0.5" min="0.5" max="50" value="${c.th}" data-al="thin" aria-label="알림 기준 퍼센트">%</span>`;
  return `<div class="alp"><div class="alh"><div><b>🔔 관심 종목 알림</b><div class="sub2">${c.on?`정한 시각에 폰이 확인해서 하루 ±${c.th}% 이상 움직인 종목을 알려드려요 (알림 켠 종목 ${n}개)`:'꺼져 있어요 · 켜면 정한 시각에 폰이 직접 확인해요'}</div></div><span class="sw${c.on?' on':''}" data-al="toggle"></span></div>`+
  (c.on?`<div class="alopt"><div class="all">알림 기준 (하루 등락률)</div><div class="alchips">${[3,5,10].map(v=>`<button class="chip${c.th===v?' on':''}" data-al="th" data-v="${v}">±${v}%</button>`).join('')}${thin}</div></div>`:'')+
  `<div class="alh" style="margin-top:14px"><div><b>📅 배당락 알림</b><div class="sub2">${c.divOn?`관심 종목의 배당락일 ${c.divDays}일 전에 알려드려요 (작년 같은 시기 기준 예상)`:'꺼져 있어요 · 켜면 관심 종목의 배당락일이 다가올 때 알려드려요'}</div></div><span class="sw${c.divOn?' on':''}" data-al="divtoggle"></span></div>`+
  (c.divOn?`<div class="alopt"><div class="all">며칠 전에 알려드릴까요?</div><div class="alchips">${[1,2,3,5,7].map(v=>`<button class="chip${c.divDays===v?' on':''}" data-al="divd" data-v="${v}">${v}일 전</button>`).join('')}</div></div>`:'')+
  (c.on||c.divOn?`<div class="alopt"><div class="all">받을 시간 (최대 3개)</div><div class="alchips">${times}${c.times.length<3?'<button class="chip addt" data-al="addbtn">+ 시간 추가</button><input type="time" data-al="addtime" value="" class="tpick" tabindex="-1">':''}</div>
  <div class="all" style="line-height:1.6">종목별로 끄려면 ★ 관심 목록의 🔔를 누르세요. 설정한 시각에 가까운 때 확인하며, 기기 절전 상태에 따라 몇 분 늦을 수 있어요.</div></div>`:'')+`</div>`;
}
function refreshAlertUI(){document.querySelectorAll('.alp-wrap').forEach(w=>{w.innerHTML=alertPanel()})}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-al]');if(!b||b.tagName==='INPUT')return;
  const k=b.dataset.al,c=alertCfg();
  if(k==='bell'){e.stopPropagation();const t=b.dataset.t,i=c.off.indexOf(t);if(i>=0)c.off.splice(i,1);else c.off.push(t);saveAlertCfg(c);b.classList.toggle('on',i>=0);b.textContent=i>=0?'🔔':'🔕';toast(i>=0?'이 종목 알림을 켰어요':'이 종목 알림을 껐어요');return}
  if(k==='toggle')setAlertsOn(!c.on);
  else if(k==='divtoggle')setAlertsOn(!c.divOn,'divOn');
  else if(k==='divd'){c.divDays=+b.dataset.v;saveAlertCfg(c)}
  else if(k==='addbtn'){const i=document.querySelector('.tpick');if(i){try{i.showPicker()}catch(x){i.focus();i.click()}}}
  else if(k==='th'){c.th=+b.dataset.v;saveAlertCfg(c)}
  else if(k==='deltime'){c.times=c.times.filter(t=>t!==b.dataset.v);if(!c.times.length)c.times=['08:30'];saveAlertCfg(c)}
},true);
document.addEventListener('change',e=>{
  const i=e.target;if(i.dataset&&i.dataset.al==='thin'){let v=parseFloat(String(i.value).replace(',','.'));if(!(v>=0.5))v=5;v=Math.min(50,Math.round(v*2)/2);const c=alertCfg();c.th=v;saveAlertCfg(c);toast('기준을 ±'+v+'%로 바꿨어요');return}
  if(!i.dataset||i.dataset.al!=='addtime'||!/^\d\d:\d\d$/.test(i.value))return;
  const c=alertCfg();if(!c.times.includes(i.value)&&c.times.length<3)c.times.push(i.value);c.times.sort();saveAlertCfg(c);
});
// 첫 관심 종목을 담으면 알림을 켤지 한 번 물어본다
function maybeAskAlerts(){
  if(!NATIVE||!AL())return;let asked='';try{asked=localStorage.getItem('etf.alertAsked')||''}catch(e){}
  if(asked||alertCfg().on)return;try{localStorage.setItem('etf.alertAsked','1')}catch(e){}
  $('#sbody').innerHTML=`<div style="text-align:center;padding:8px 0 4px"><div style="font-size:40px">🔔</div><div style="font-size:19px;font-weight:700;margin:6px 0">관심 종목이 움직이면 알려드릴까요?</div><div style="color:var(--ink2);font-size:14px;line-height:1.7">내가 정한 시각에 폰이 직접 확인해서<br>하루 ±5% 이상 움직인 종목만 알려드려요.<br>시각과 기준은 ⚙ 설정에서 바꿀 수 있어요.</div><button class="close" id="alYes" style="margin-top:18px">알림 켜기</button></div>`;
  $('#sheet').classList.add('on');document.body.style.overflow='hidden';
  $('#alYes').onclick=()=>{closeS();setAlertsOn(true)};
}
if(NATIVE&&AL()){
  const a=AL();
  syncAlerts();
  try{a.addListener('alertTap',ev=>runLink(ev&&ev.link))}catch(e){}
  a.getLaunchLink().then(r=>{if(r&&r.link)runLink(r.link)}).catch(()=>{});
  // 처음 실행하면 안드로이드 기본 알림 허용 팝업을 한 번 띄운다 (소개 화면이 끝난 뒤)
  let asked='';try{asked=localStorage.getItem('etf.permAsked')||''}catch(e){}
  if(!asked)setTimeout(()=>{
    try{localStorage.setItem('etf.permAsked','1')}catch(e){}
    a.notifyStatus().then(r=>{if(!r||!r.granted)a.requestNotify().catch(()=>{})}).catch(()=>{});
  },2500);
}
if(NATIVE)document.addEventListener('click',e=>{if(e.target.id==='pushLink'){e.preventDefault();openOptions()}});
let backAt=0;
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800)}
if(PL.App&&PL.App.addListener){PL.App.addListener('backButton',()=>{
  if($('#sheet').classList.contains('on'))return closeS();
  if(tab==='blog'&&bopen){bopen='';render();return}
  if(tab!=='all'){tab='all';render();scrollTo(0,0);return}
  if(Date.now()-backAt<2000){PL.App.exitApp();return}
  backAt=Date.now();toast('한 번 더 누르면 종료돼요');
})}
</script>
<script src="options.js"></script>
